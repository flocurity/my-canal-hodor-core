[project]
name = "mycanal-hodor-core"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.7.0",
    'requests>=2.34.2',
    'structlog>=26.1.0',
]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
interactive = [
    "prompt-toolkit>=3.0.53",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mycanal_hodor_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not integration"'
markers = ["integration: opt-in real API tests"]

[dependency-groups]
dev = [
    "prompt-toolkit>=3.0.53",
    "pytest>=9.1.1",
]
